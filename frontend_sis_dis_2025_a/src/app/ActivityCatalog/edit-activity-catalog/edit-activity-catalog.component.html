<div class="container col-md-6 mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Editar Catalogo de Actividades</h3>
        </div>
        <div class="card-body">
            <form>
                
                <div class="form-group">
                    <label for="">Nombre</label>
                    <input type="text" class="form-control" [(ngModel)]="activityCatalog.name" name="name">
                </div>
                

                
                <button type="button" (click)="ActualizarActivityCatalog(activityCatalog)" class="btn btn-success">Guardar</button>
            </form>

            <div>

            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-4">
        <button [routerLink]="['/']" class="custom-link-btn">Volver</button>

    </div>
</div>
