<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Sedes</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr class="text-center">
                        <th>ID</th>
                        <th>NOMBRE</th>
                        <th>DIRECCION</th>
                        <th>TELEFONO</th>
                        <th>ESTADO</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let campus of campuses" class="text-center">
                        <td>{{campus.id}}</td>
                        <td>{{campus.name}}</td>
                        <td>{{campus.address}}</td>
                        <td>{{campus.phone}}</td>
                        <td>{{campus.status ? 'Activo' : 'Inactivo'}}</td>
                        <td>
                            <button (click)="editarCampus(campus)" class="btn btn-primary"> <i class="bi bi-pencil-square me-2"></i>Editar</button>
                            <button (click)="deleteCampus(campus)" class="btn btn-danger" style="margin-left: 10px;"><i class="bi bi-trash me-2"></i>Eliminar</button>
                        </td>

                    </tr>
                </tbody>

            </table>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-4 mt-4">
        <button [routerLink]="['/']" class="btn btn-outline-secondary btn-lg custom-btn-volver">
            <i class="bi bi-arrow-left-circle me-2"></i> Volver
        </button>
    </div>
</div>
