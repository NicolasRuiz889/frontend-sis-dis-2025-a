<div class="container">
    <div class="card">
        <div class="card-header">
            <h3>Sedes</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr class="text-center">
                        <th>ID</th>
                        <th>NOMBRE</th>
                        <th>DIRECCION</th>
                        <th>TELEFONO</th>
                        <th>ESTADO</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let campus of campuses" class="text-center">
                        <td>{{campus.id}}</td>
                        <td>{{campus.name}}</td>
                        <td>{{campus.address}}</td>
                        <td>{{campus.phone}}</td>
                        <td>{{campus.status ? 'Activo' : 'Inactivo'}}</td>
                        <td>
                            <button (click)="editarCampus(campus)" class="btn btn-warning">Editar</button>
                            <button (click)="deleteCampus(campus)" class="btn btn-danger" style="margin-left: 10px;">Eliminar</button>
                        </td>

                    </tr>
                </tbody>

            </table>
        </div>
    </div>
</div>
