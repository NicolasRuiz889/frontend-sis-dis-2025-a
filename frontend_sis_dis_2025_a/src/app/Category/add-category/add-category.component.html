<div class="container col-md-6 mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Agregar Categoria</h3>
        </div>
        <div class="card-body">
            <form>
                <div class="form-group">
                    <label for="">Codigo</label>
                    <input type="text" class="form-control" [(ngModel)]="category.code" name="code">
                </div>
                <div class="form-group">
                    <label for="">Nombre</label>
                    <input type="text" class="form-control" [(ngModel)]="category.name" name="name">
                </div>
                <div class="form-group">
                    <label for="">Descripcion</label>
                    <input type="text" class="form-control" [(ngModel)]="category.description" name="description">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" [(ngModel)]="category.status" name="status">
                        Activa
                    </label>
                </div>

                
                <button type="button" (click)="GuardarCategory(category)" class="btn btn-success">Guardar</button>
            </form>

            <div>

            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-4">
        <button [routerLink]="['/']" class="custom-link-btn">Volver</button>

    </div>
</div>
