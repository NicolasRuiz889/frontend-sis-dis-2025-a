<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Categorias</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr class="text-center">
                        <th>ID</th>
                        <th>NOMBRE</th>
                        <th>DESCRIPCION</th>
                        <th>ESTADO</th>
                        <th>ACCIONES</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let category of categories" class="text-center">
                        <td>{{category.id}}</td>
                        <td>{{category.name}}</td>
                        <td>{{category.description}}</td>
                        <td>{{category.status ? 'Activo' : 'Inactivo'}}</td>
                    
                        <td>
                            <button (click)="editarCategory(category)" class="btn btn-primary"><i class="bi bi-pencil-square me-2"></i>Editar</button>
                            <button (click)="deleteCategory(category)" class="btn btn-danger"
                                style="margin-left: 10px;"> <i class="bi bi-trash me-2"></i>Eliminar</button>
                        </td>

                    </tr>
                </tbody>

            </table>
        </div>

    </div>

    <div class="d-flex justify-content-center gap-4">
        <button [routerLink]="['/']" class="custom-link-btn">Volver</button>

    </div>
</div>
