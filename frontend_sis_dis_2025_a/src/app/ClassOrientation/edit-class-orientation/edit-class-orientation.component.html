<div class="container col-md-6 mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Actualizar Orientación de Clase</h3>
        </div>
        <div class="card-body">
            <form>
                <!-- Asignatura -->
                <div class="form-group">
                    <label>Asignatura</label>
                    <select class="form-control" [(ngModel)]="classOrientation.subjectId" name="subjectId" required>
                        <option [ngValue]="null" disabled selected>Seleccione una asignatura</option>
                        <option *ngFor="let subject of subjects" [ngValue]="subject.id">{{ subject.name }}</option>
                    </select>
                </div>

                <!-- Programa -->
                <div class="form-group">
                    <label>Programa</label>
                    <select class="form-control" [(ngModel)]="classOrientation.programId" name="programId" required>
                        <option [ngValue]="null" disabled selected>Seleccione un programa</option>
                        <option *ngFor="let program of programs" [ngValue]="program.id">{{ program.name }}</option>
                    </select>
                </div>

                <!-- Grupo -->
                <div class="form-group">
                    <label>Grupo</label>
                    <select class="form-control" [(ngModel)]="classOrientation.groupId" name="groupId" required>
                        <option [ngValue]="null" disabled selected>Seleccione un grupo</option>
                        <option *ngFor="let group of groups" [ngValue]="group.id">{{ group.code }}</option>
                    </select>
                </div>

                <!-- Sede -->
                <div class="form-group">
                    <label>Sede</label>
                    <select class="form-control" [(ngModel)]="classOrientation.campusId" name="campusId" required>
                        <option [ngValue]="null" disabled selected>Seleccione una sede</option>
                        <option *ngFor="let campus of campuses" [ngValue]="campus.id">{{ campus.name }}</option>
                    </select>
                </div>

                <!-- Horas semanales -->
                <div class="form-group">
                    <label>Horas Semanales</label>
                    <input type="number" class="form-control" [(ngModel)]="classOrientation.weeklyHours"
                        name="weeklyHours" required />
                </div>

                <!-- Horas semestre (calculadas) -->
                <div class="form-group mb-4">
                    <label>Horas Semestre</label>
                    <input type="number" class="form-control" [value]="calculatedSemesterHours" readonly />
                </div>

                <div class="d-flex justify-content-center gap-4 mt-4">
                    <button type="button" class="btn btn-success"
                        (click)="ActualizarClassOrientation(classOrientation)">Guardar</button>

                    <button [routerLink]="['/']" class="btn btn-outline-secondary btn-lg custom-btn-volver">
                        <i class="bi bi-arrow-left-circle me-2"></i> Volver
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
