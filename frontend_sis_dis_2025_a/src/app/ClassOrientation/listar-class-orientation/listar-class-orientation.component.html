<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Orientaciones de Clase</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr class="text-center">
                        <th>NOMBRE ASIGNATURA</th>
                        <th>PROGRAMA</th>
                        <th>GRUPO</th>
                        <th>SEDE</th>
                        <th>DEDICACIÓN (HORAS SEMANALES)</th>
                        <th>DEDICACIÓN (HORAS SEMESTRE)</th>
                        <th>ACCIONES</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let class of classOrientations" class="text-center">
                        <td>{{ class.subjectName }}</td>
                        <td>{{ class.programName }}</td>
                        <td>{{ class.groupName }}</td>
                        <td>{{ class.campusName }}</td>
                        <td>{{ class.weeklyHours }}</td>
                        <td>{{ class.semesterHours }}</td>

                        <td>
                            <div class="d-flex justify-content-center gap-1">
                            <button (click)="editarClassOrientation(class)" class="btn btn-primary d-inline-flex align-items-center"><i
                                    class="bi bi-pencil-square me-2"></i>Editar</button>
                            <button (click)="deleteClassOrientation(class)" class="btn btn-danger d-inline-flex align-items-center"
                                style="margin-left: 10px;"> <i class="bi bi-trash me-2"></i>Eliminar</button>
                       
                            </div>
                            </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="d-flex justify-content-center gap-4">
        <button [routerLink]="['/']" class="custom-link-btn">Volver</button>
    </div>
