<div class="container col-md-6 mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Editar Facultad</h3>
        </div>
        <div class="card-body">
            <form>
                <div class="form-group">
                    <label for="">Nombre</label>
                    <input type="text" class="form-control" [(ngModel)]="faculty.name" name="name">
                </div>
                <div class="form-group">
                    <label for="">Descripcion</label>
                    <input type="text" class="form-control" [(ngModel)]="faculty.description" name="description">
                </div>

                <div class="check form-group">
                    <label>
                        <input type="checkbox" [(ngModel)]="faculty.status" name="status">
                        Activa
                    </label>
                </div>

                <div class="selects form-group mb-4">
                    <label for="campus">Sede</label>
                    <select [(ngModel)]="faculty.campusId" name="campusId" id="campus"
                        class="form-select form-select-lg" required>
                        <option [ngValue]="null" disabled selected>Seleccione un campus</option>
                        <option *ngFor="let campus of campuses" [ngValue]="campus.id">
                            {{ campus.name }}
                        </option>
                    </select>
                </div>
                <div class="d-flex justify-content-center gap-4 mt-4">
                    <button type="button" (click)="ActualizarFaculty(faculty)" class="btn btn-success">Guardar</button>
                    <button [routerLink]="['/']" class="btn btn-outline-secondary btn-lg custom-btn-volver">
                        <i class="bi bi-arrow-left-circle me-2"></i> Volver
                    </button>
                </div>
            </form>

            <div>

            </div>
        </div>
    </div>

</div>
