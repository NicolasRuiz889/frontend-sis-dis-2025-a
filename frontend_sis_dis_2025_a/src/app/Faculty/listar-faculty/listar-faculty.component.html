<div class="container">
    <div class="card">
        <div class="card-header">
            <h3>Sedes</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr class="text-center">
                        <th>ID</th>
                        <th>NOMBRE</th>
                        <th>DESCRIPCION</th>
                        <th>ESTADO</th>
                        <th>CAMPUS</th>
                        <th>ACCIONES</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let faculty of faculties" class="text-center">
                        <td>{{faculty.id}}</td>
                        <td>{{faculty.name}}</td>
                        <td>{{faculty.description}}</td>
                        <td>{{faculty.status ? 'Activo' : 'Inactivo'}}</td>
                        <td>{{faculty.campusId}}</td>
                        <td>
                            <button (click)="editarFaculty(faculty)" class="btn btn-warning">Editar</button>
                            <button (click)="deleteFaculty(faculty)" class="btn btn-danger" style="margin-left: 10px;">Eliminar</button>
                        </td>

                    </tr>
                </tbody>

            </table>
        </div>
    </div>
</div>
