<div class="container col-md-6 mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Agregar Grupo</h3>
        </div>
        <div class="card-body">
            <form>
                <div class="form-group">
                    <label for="">Codigo</label>
                    <input type="text" class="form-control" [(ngModel)]="group.code" name="code">
                </div>
                <div class="form-group">
                    <label for="">Periodo</label>
                    <input type="text" class="form-control" [(ngModel)]="group.period" name="period">
                </div>

                <div class="check form-group">
                    <label>
                        <input type="checkbox" [(ngModel)]="group.status" name="status">
                        Activa
                    </label>
                </div>

                <div class="selects form-group mb-4">
                    <label for="campus">Asignatura</label>
                    <select [(ngModel)]="group.subjectId" name="subjectId" id="subject"
                        class="form-select form-select-lg" required>
                        <option [ngValue]="null" disabled selected>Seleccione una Asignatura</option>
                        <option *ngFor="let subject of subjects" [ngValue]="subject.id">
                            {{ subject.name }}
                        </option>
                    </select>
                </div>
                <div class="d-flex justify-content-center gap-4 mt-4">
                    <button type="button" (click)="GuardarGroup(group)" class="btn btn-success">Guardar</button>
                    <button [routerLink]="['/']" class="btn btn-outline-secondary btn-lg custom-btn-volver">
                        <i class="bi bi-arrow-left-circle me-2"></i> Volver
                    </button>
                </div>
            </form>

            <div>

            </div>
        </div>
    </div>

</div>
