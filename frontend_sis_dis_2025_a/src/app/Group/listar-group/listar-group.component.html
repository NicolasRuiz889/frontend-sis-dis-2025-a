<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Grupo</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr class="text-center">
                        <th>ID</th>
                        <th>CODIGO</th>
                        <th>PERIODO ACADEMICO</th>
                        <th>ESTADO</th>
                        <th>ASIGNATURA</th>
                        <th>ACCIONES</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let group of groups" class="text-center">
                        <td>{{group.id}}</td>
                        <td>{{group.code}}</td>
                        <td>{{group.period}}</td>
                        <td>{{group.status ? 'Activo' : 'Inactivo'}}</td>
                        <td>{{group.subjectId}}</td>
                        <td>
                            <button (click)="editarGroup(group)" class="btn btn-primary"><i class="bi bi-pencil-square me-2"></i>Editar</button>
                            <button (click)="deleteGroup(group)" class="btn btn-danger"
                                style="margin-left: 10px;"><i class="bi bi-trash me-2"></i>Eliminar</button>
                        </td>

                    </tr>
                </tbody>

            </table>
        </div>

    </div>

    <div class="d-flex justify-content-center gap-4 mt-4">
        <button [routerLink]="['/']" class="btn btn-outline-secondary btn-lg custom-btn-volver">
            <i class="bi bi-arrow-left-circle me-2"></i> Volver
        </button>
    </div>
</div>
