
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3>Sedes</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr class="text-center">
                        <th>ID</th>
                        <th>CODIGO</th>
                        <th>NOMBRE</th>
                        <th>MODALIDAD</th>
                        <th>JORNADA</th>
                        <th>DURACION</th>
                        <th>TITULO QUE OTORGA</th>
                        <th>ESTADO</th>
                        <th>FACULTAD</th>
                        <th>ACCIONES</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let program of programs" class="text-center">
                        <td>{{program.id}}</td>
                        <td>{{program.code}}</td>
                        <td>{{program.name}}</td>
                        <td>{{program.modality}}</td>
                        <td>{{program.schedule}}</td>
                        <td>{{program.duration}}</td>
                        <td>{{program.degreeAwarded}}</td>
                        <td>{{program.status ? 'Activo' : 'Inactivo'}}</td>
                        <td>{{program.facultyId}}</td>
                        <td>
                            <button (click)="editarProgram(program)" class="btn btn-warning">Editar</button>
                            <button (click)="deleteProgram(program)" class="btn btn-danger" style="margin-left: 10px;">Eliminar</button>
                        </td>

                    </tr>
                </tbody>

            </table>
        </div>
    </div>
</div>
