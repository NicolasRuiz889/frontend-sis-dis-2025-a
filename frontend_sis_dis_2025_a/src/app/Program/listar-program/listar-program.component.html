<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Sedes</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr class="text-center">
                        <th>ID</th>
                        <th>CODIGO</th>
                        <th>NOMBRE</th>
                        <th>MODALIDAD</th>
                        <th>JORNADA</th>
                        <th>DURACION</th>
                        <th>TITULO QUE OTORGA</th>
                        <th>ESTADO</th>
                        <th>FACULTAD</th>
                        <th>ACCIONES</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let program of programs" class="text-center">
                        <td>{{program.id}}</td>
                        <td>{{program.code}}</td>
                        <td>{{program.name}}</td>
                        <td>{{program.modality}}</td>
                        <td>{{program.schedule}}</td>
                        <td>{{program.duration}}</td>
                        <td>{{program.degreeAwarded}}</td>
                        <td>{{program.status ? 'Activo' : 'Inactivo'}}</td>
                        <td>{{program.facultyId}}</td>
                        <td>
                            <button (click)="editarProgram(program)" class="btn btn-primary"><i class="bi bi-pencil-square me-2"></i>Editar</button>
                            <button (click)="deleteProgram(program)" class="btn btn-danger"
                                style="margin-left: 10px;"> <i class="bi bi-trash me-2"></i>Eliminar</button>
                        </td>

                    </tr>
                </tbody>

            </table>
        </div>

    </div>

    <div class="d-flex justify-content-center gap-4">
        <button [routerLink]="['/']" class="custom-link-btn">Volver</button>

    </div>
</div>
