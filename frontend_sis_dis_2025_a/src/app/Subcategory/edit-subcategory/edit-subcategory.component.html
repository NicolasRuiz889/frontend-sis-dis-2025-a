<div class="container col-md-6 mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Editar Subcategoria</h3>
        </div>
        <div class="card-body">
            <form>
                
                <div class="form-group">
                    <label for="">Nombre</label>
                    <input type="text" class="form-control" [(ngModel)]="subcategory.name" name="name">
                </div>
                <div class="form-group">
                    <label for="">descripcion</label>
                    <input type="text" class="form-control" [(ngModel)]="subcategory.description" name="description">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" [(ngModel)]="subcategory.status" name="status">
                        Activa
                    </label>
                </div>

                <div class="form-group mb-4">
                    <label for="category">Categoria</label>
                    <select [(ngModel)]="subcategory.categoryId" name="categoryId" required>
                        <option [ngValue]="null" disabled selected>Seleccione una Categoria</option>
                        <option *ngFor="let category of categories" [ngValue]="category.id">
                            {{ category.name }}
                        </option>
                    </select>
                </div>
                <button type="button" (click)="ActualizarSubcategory(subcategory)" class="btn btn-success">Guardar</button>
            </form>

            <div>

            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-4">
        <button [routerLink]="['/listarsubcategory']" class="custom-link-btn">Volver</button>

    </div>
</div>
