<div class="container col-md-6 mt-5">

    <div class="card ">
        <div class="card-header">
            <h3>Editar Asignatura</h3>
        </div>
        <div class="card-body">
            <form >
                <div class="form-group">
                    <label for="">Codigo</label>
                    <input type="text" class="form-control" [(ngModel)]="subject.code" name="code">
                </div>
                <div class="form-group">
                    <label for="">Nombre</label>
                    <input type="text" class="form-control" [(ngModel)]="subject.name" name="name">
                </div>
                <div class="form-group">
                    <label for="">Creditos</label>
                    <input type="text" class="form-control" [(ngModel)]="subject.credits" name="credits">
                </div>

                <div class="form-group">
                    <label for="">Descripcion</label>
                    <input type="text" class="form-control" [(ngModel)]="subject.description" name="description">
                </div>
                
               
                <div class="form-group">
                    <label>
                      <input type="checkbox" [(ngModel)]="subject.status" name="status">
                      Activa
                    </label>
                  </div>

                  <div class="form-group mb-4">
                    <label for="program">Programa</label>
                    <select [(ngModel)]="subject.programId" name="programId" required>
                      <option [ngValue]="null" disabled selected>Seleccione un Programa</option>
                      <option *ngFor="let program of programs" [ngValue]="program.id">
                        {{ program.name }}
                      </option>
                    </select>
                  </div>
                  
                <button type="button" (click)="ActualizarSubject(subject)" class="btn btn-success">Guardar</button>
           
            </form>

            <div>
               
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-4">
        <button [routerLink]="['/']" class="custom-link-btn">Volver</button>

    </div>
</div>
