<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Asignatura</h3>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr class="text-center">
                        <th>ID</th>
                        <th>CODIGO</th>
                        <th>NOMBRE</th>
                        <th>CREDITOS</th>
                        <th>DESCRIPCION</th>
                        <th>ESTADO</th>
                        <th>CODIGO PROGRAMA</th>
                       

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let subject of subjects " class="text-center">
                        <td>{{subject.id}}</td>
                        <td>{{subject.code}}</td>
                        <td>{{subject.name}}</td>
                        <td>{{subject.credits}}</td>
                        <td>{{subject.description}}</td>
                        <td>{{subject.status ? 'Activo' : 'Inactivo'}}</td>
                        <td>{{subject.programId}}</td>
                        

                        <td>
                            <button (click)="editarSubject(subject)" class="btn btn-primary"><i class="bi bi-pencil-square me-2"></i>Editar</button>
                            <button (click)="deleteSubject(subject)" class="btn btn-danger"
                                style="margin-left: 10px;"><i class="bi bi-trash me-2"></i>Eliminar</button>
                        </td>


                    </tr>
                </tbody>

            </table>
        </div>

    </div>

    <div class="d-flex justify-content-center gap-4 mt-4">
        <button [routerLink]="['/']" class="btn btn-outline-secondary btn-lg custom-btn-volver">
            <i class="bi bi-arrow-left-circle me-2"></i> Volver
        </button>
    </div>

</div>
